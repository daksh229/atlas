# Render Blueprint for the BF Atlas FastAPI backend.
# Render → New → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: bf-atlas-api
    runtime: python
    plan: free
    rootDir: bf_atlas/backend
    # Install deps, then build the SQLite DB + Atlas layer + RAG corpus.
    buildCommand: "pip install -r requirements.txt && cd ../data && python seed_generate.py && python init_all.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: AUTH_SECRET          # JWT signing secret (auto-generated)
        generateValue: true
      - key: ANTHROPIC_API_KEY    # optional — set in the dashboard to enable AI; blank = offline fallbacks
        sync: false
      - key: RAG_EMBEDDER         # tfidf = offline, no model download
        value: tfidf
